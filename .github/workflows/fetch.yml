name: fetch-comments
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -U yt-dlp youtube-comment-downloader
      - name: grab
        run: |
          URL="https://www.youtube.com/watch?v=v4860RGi7IY"
          ID="v4860RGi7IY"
          { echo "=== A comment-downloader ==="
            youtube-comment-downloader --url "$URL" --output comments.json --limit 600
          } >> log.txt 2>&1 || true
          if [ ! -s comments.json ]; then
            { echo "=== B yt-dlp clients ==="
              for pc in tv android_vr ios mweb web_embedded; do
                echo "--- $pc ---"
                yt-dlp --skip-download --write-comments --write-info-json \
                  --extractor-args "youtube:player_client=$pc;comment_sort=top;max_comments=300,all,0" \
                  -o "info_$pc" "$URL" && break
              done
            } >> log.txt 2>&1 || true
          fi
          if [ ! -s comments.json ] && ! ls info_*.info.json >/dev/null 2>&1; then
            { echo "=== C invidious ==="
              for base in https://inv.nadeko.net https://invidious.nerdvpn.de https://yewtu.be https://iv.melmac.space; do
                echo "--- $base ---"
                curl -s -m 30 "$base/api/v1/comments/$ID?sort_by=top" -o inv.json
                if [ -s inv.json ] && grep -q likeCount inv.json; then mv inv.json comments_inv.json; break; fi
              done
            } >> log.txt 2>&1 || true
          fi
          ls -la >> log.txt
      - name: save
        if: always()
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git commit -m result || echo nothing
          git push || echo pushfail
