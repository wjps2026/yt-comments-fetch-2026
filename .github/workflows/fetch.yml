name: fetch-comments
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q -U yt-dlp
      - name: grab
        run: |
          yt-dlp --skip-download --write-comments --write-info-json \
            --extractor-args "youtube:comment_sort=top;max_comments=400,all,0" \
            -o info "https://www.youtube.com/watch?v=v4860RGi7IY" > log.txt 2>&1 || true
          tail -40 log.txt
      - name: save
        if: always()
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git commit -m result || echo nothing
          git push || echo pushfail
